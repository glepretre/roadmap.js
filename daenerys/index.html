        :root {
            --font-family: 'Cinzel', serif, 'Inter', -apple-system, sans-serif;
            --bg-color: #1a1a1a;
            --text-main: #e5e7eb;

            --border-color: #374151;

            --header-bg: #2d2d2d;

            --header-title-transform: uppercase;

            --badge-bg: #374151;

            --epic-bar-hover-filter: brightness(1.2);
            --epic-bar-hover-shadow: 0 6px 10px rgba(0,0,0,0.4);

            --marker-color: #4b5563;
            --marker-text: #9ca3af;

            --card-bg: #1f2937;
            --card-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.4);
            --card-id-bg: rgba(0, 0, 0, 0.3);
            --epic-card-title-transform: uppercase;

            --table-th-bg: #111827;

            --table-td-border: #374151;

    <div id="app"></div>

    <script>
        const Roadmap = window.RoadmapGen.Roadmap;

        Promise.resolve({

        },
        {

        },
        {
          "id": 3,
          "name": "Ironborn Alliance & Fleet",
          "start": "0298-09-01",
          "duration": { "value": 2, "unit": "months" },
          "tasks": [

            { "title": "Repairing the Meereenese Fleet", "roadmap_id": "FLT02" },
            { "title": "Setting sail for Westeros", "roadmap_id": "FLT03" }

      ]
    },
    {
      "name": "The Landing & The War",

            { "title": "Mining Dragonglass", "roadmap_id": "WES02" },
            { "title": "Summoning Jon Snow", "roadmap_id": "WES03" }

        },
        {

          "name": "Battle of the Goldroad",
          "start": "0299-01-01",
          "duration": { "value": 1, "unit": "months" },

          ]
        },
        {
          "id": 6,
          "name": "The Northern Alliance",
          "start": "0299-02-01",
          "duration": { "value": 2, "unit": "months" },

            { "title": "Bending the Knee (Jon Snow)", "roadmap_id": "NOR02" },
            { "title": "Truce at the Dragonpit", "roadmap_id": "NOR03" }
          ]

      ]

    {
      "name": "Final Conquest",
      "epics": [
        {
          "id": 7,
          "name": "The Long Night",
          "start": "0299-04-01",
          "duration": { "value": 2, "unit": "months" },
          "tasks": [
            { "title": "Defense of Winterfell", "roadmap_id": "WW01" },
            { "title": "Defeating the Night King", "roadmap_id": "WW02" },
            { "title": "Honoring the Fallen", "roadmap_id": "WW03" }
          ]
        },
        {
          "id": 8,
          "name": "Siege of King's Landing",
          "start": "0299-06-01",
          "duration": { "value": 1, "unit": "months" },
          "tasks": [
            { "title": "Death of Rhaegal & Missandei", "roadmap_id": "KL01" },
            { "title": "Destruction of the Iron Fleet", "roadmap_id": "KL02" },
            { "title": "Burning the City", "roadmap_id": "KL03" }

        {
          "id": 9,
          "name": "The Iron Throne",
          "start": "0299-07-01",
          "duration": { "value": 1, "unit": "months" },
          "tasks": [
            { "title": "Victory Speech", "roadmap_id": "END01" },
            { "title": "Final Confrontation with Jon Snow", "roadmap_id": "END02" },
            { "title": "Melting of the Throne", "roadmap_id": "END03" }
          ]
        }
      ]

  ]

                const roadmap = new Roadmap({
                    mountPoint: '#app',
                    data: data,
                    epicColors: epicColors,

                        lastUpdated: 'Last Updated',

                roadmap.init();
            });

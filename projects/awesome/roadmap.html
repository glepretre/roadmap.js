<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roadmap: Awesome project</title>
    <style>
        :root {
            --current-date-color: #3b82f6;
        }
    </style>
</head>
<body>
    <div id="app"></div>

    <script type="module" id="app-script">
        import { Roadmap } from '../../src/roadmap.js';

        const epicColors = {
            1: "#6366f1",
            2: "#10b981",
            3: "#f59e0b",
            4: "#ef4444",
            5: "#8b5cf6",
            6: "#06b6d4",
            7: "#f97316",
            8: "#475569",
            9: "#ec4899",
            10: "#4d7c0f",
            11: "#1e40af"
        };

        fetch('data.json')
            .then(response => response.json())
            .then(data => {
                const roadmap = new Roadmap({
                    mountPoint: '#app',
                    data: data,
                    epicColors: epicColors,
                    lastUpdated: 'July 12th 2026',
                });
                roadmap.init();
            });
    </script>
</body>
</html>
